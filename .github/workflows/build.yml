name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # One place, like Retro-C64. Repeating the literal in every job is how
  # they drift apart.
  FLUTTER_VERSION: '3.41.9'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # ymir-core has 8 sub-submodules (mio, fmt, imgui, xxHash, lz4,
          # libchdr, concurrentqueue, vcpkg) which Flutter's CMake pulls
          # in via add_subdirectory(libs/ymir-core).
      # Pinned, like the Amiga, C64 and DOSBox workflows. Unpinned, this
      # follows whatever stable is on the day, and a new analyzer lint turns
      # a green pipeline red with no change to the code -- which is exactly
      # what happened: CI on 3.47.1 found an issue 3.41.9 does not have, and
      # the analyze job failing skipped android, linux, ios and release.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
        working-directory: flutter_app
      - run: flutter analyze
        working-directory: flutter_app
      - run: flutter test
        working-directory: flutter_app

  android:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - uses: android-actions/setup-android@v3
      - name: Build Android arm64-v8a .so
        run: native/ymir_core/android/build.sh
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-android.outputs.ndk-path }}
      - run: |
          test -f flutter_app/android/app/src/main/jniLibs/arm64-v8a/libymircore.so
      # Signed with the release key, not the debug one.
      #
      # This job used to build the bundle with no keystore at all, which
      # produces an artefact that installs on a dev device and is refused by
      # Play -- the release key is what identifies this as an update to
      # com.crownpark.ymir_multiplatform rather than a different app. The
      # secrets have been on this repo since June; nothing was reading them.
      #
      # build.gradle.kts picks the keystore up from these ANDROID_* env vars
      # and falls back to the debug key when they are absent, so a fork
      # without the secrets still gets a green build rather than a failure it
      # cannot fix.
      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/release.jks"

      - run: flutter build apk --release
        working-directory: flutter_app
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/signing/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: flutter build appbundle --release
        working-directory: flutter_app
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/signing/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      # The bundle has to be signed as the app it replaces: a different key is
      # a different app as far as the Console is concerned, and this is the
      # cheap place to catch that rather than at upload.
      - name: Print signing fingerprint
        run: |
          keytool -printcert -jarfile \
            flutter_app/build/app/outputs/bundle/release/app-release.aab \
            | grep -E "SHA256:|Owner:" || true
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: flutter_app/build/app/outputs/bundle/release/app-release.aab

  linux:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      # flutter build linux needs the GTK stack, not just ALSA: the desktop
      # embedder's CMakeLists does pkg_check_modules(gtk+-3.0) and fails the
      # configure step without it. Only libasound2-dev was installed, which
      # covers the core's audio backend and nothing the shell needs.
      - run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libgtk-3-dev liblzma-dev pkg-config \
            ninja-build clang cmake
      - name: Build Linux host tests + .so
        run: native/ymir_core/linux/build-ymir-linux.sh
      - name: Run native tests
        run: |
          for t in ymir_smoke_test ymir_peripheral_test \
                   ymir_swap_snapshot_test ymir_audio_tone_test; do
            native/ymir_core/linux/build/$t
          done
      - run: flutter build linux --release
        working-directory: flutter_app
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: flutter_app/build/linux/x64/release/bundle

  ios:
    needs: analyze
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      # Built natively, on the Mac, with Xcode's own toolchain.
      #
      # This used to shell out to tools/build-ios-linux.sh, which drove the
      # mobaiapp/iosbox Docker image -- a path that could never run here.
      # macOS runners have no Docker (the failure was a bare `docker: command
      # not found`), and moving it to a Linux runner would not have helped
      # either: that image also wants an iOS SDK volume populated by hand from
      # an Xcode extraction. A Mac already has the SDK, so nothing needs to be
      # cross-anything. The script installs the framework into
      # flutter_app/ios/Frameworks, which is where the Runner embeds it from.
      # The core is COMMITTED as an xcframework and is no longer built here.
      # Building it took minutes and produced a device-only .framework, which
      # is the wrong shape now: an xcframework carries the simulator slice too,
      # and Xcode picks whichever the destination needs.
      - name: Verify the committed core carries both slices
        run: |
          xc=flutter_app/ios/Frameworks/YmirCore.xcframework
          for slice in ios-arm64 ios-arm64-simulator; do
            bin="$xc/$slice/YmirCore.framework/YmirCore"
            if [ ! -f "$bin" ]; then
              echo "::error::$bin is missing -- rebuild with"
              echo "::error::native/ymir_core/ios/build-ios-macos.sh and commit the result."
              exit 1
            fi
          done
          # Each slice must be for the platform it claims. A device binary in
          # the simulator slot builds green and dies at dlopen on a simulator.
          vtool -show-build "$xc/ios-arm64/YmirCore.framework/YmirCore" \
            | grep -q "platform IOS$" \
            || { echo "::error::ios-arm64 slice is not a device binary"; exit 1; }
          vtool -show-build "$xc/ios-arm64-simulator/YmirCore.framework/YmirCore" \
            | grep -q "platform IOSSIMULATOR" \
            || { echo "::error::simulator slice is not a simulator binary"; exit 1; }

      - run: flutter build ios --release --no-codesign
        working-directory: flutter_app

      # An app that builds but ships no core installs fine and then dies at
      # the first dlopen, which reads as a signing fault and is not one. Prove
      # the embed phase actually ran, at the exact path
      # YmirNativePaths.iosFrameworkLibrary() opens at runtime.
      - name: Verify the core is embedded in the app
        run: |
          app=flutter_app/build/ios/iphoneos/Runner.app
          binary="$app/Frameworks/YmirCore.framework/YmirCore"
          if [ ! -f "$binary" ]; then
            echo "::error::YmirCore.framework is missing from $app/Frameworks --"
            echo "::error::the Runner target's Embed Frameworks phase did not copy it."
            exit 1
          fi
          file "$binary"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: flutter_app/build/ios/iphoneos/Runner.app

      # --- Signed build, and the upload that actually creates an App Store
      # --- build. Everything above produces an artifact nobody can install.
      #
      # All of it is skipped unless the secrets are set, so forks and pull
      # requests still build the unsigned app rather than failing on a
      # missing credential.
      - name: Do we have signing and API credentials?
        id: creds
        run: |
          if [ -n "${{ secrets.APPSTORE_CERT_BASE64 }}" ] \
             && [ -n "${{ secrets.ASC_KEY_P8_BASE64 }}" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "note: no signing/API secrets -- skipping the App Store upload"
          fi

      - name: Import signing certificate
        if: steps.creds.outputs.have == 'true'
        env:
          CERT_BASE64: ${{ secrets.APPSTORE_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPSTORE_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPSTORE_PROFILE_BASE64 }}
        run: |
          KEYCHAIN=build.keychain
          security create-keychain -p actions "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"     # no auto-lock mid-build
          security unlock-keychain -p actions "$KEYCHAIN"
          echo "$CERT_BASE64" | base64 -d > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          # codesign: belongs in this list. Without it the key is present,
          # `security find-identity` reports it as valid, and every signing
          # attempt fails with errSecInternalComponent -- which reads as a
          # broken certificate and is not one.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k actions "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 -d \
            > ~/Library/MobileDevice/Provisioning\ Profiles/build.mobileprovision
          rm cert.p12

      # App Store Connect refuses a CFBundleVersion it has already seen, and
      # says so only AFTER the whole upload has transferred. A timestamp is
      # monotonic without having to ask the server what the highest number is,
      # and is comfortably above the numbers already used.
      - name: Choose a build number
        if: steps.creds.outputs.have == 'true'
        id: buildno
        run: echo "n=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      # xcodebuild archive + export, NOT `flutter build ipa`.
      #
      # The Runner target is set to Automatic signing, and `flutter build ipa`
      # honours that: it looks for a DEVELOPMENT certificate and a Development
      # Team, finds neither on a runner with no Apple ID, and stops with "No
      # development certificates available to code sign app for device
      # deployment" -- while the distribution certificate and profile it
      # actually needs are sitting right there, imported and installed.
      #
      # Manual signing is passed on the command line so the committed project
      # keeps Automatic, which is what a developer opening it in Xcode wants.
      - name: Build signed IPA
        if: steps.creds.outputs.have == 'true'
        working-directory: flutter_app
        env:
          TEAM_ID: 88A3T9K9C5
          BUNDLE_ID: com.crownparkcomputing.saturnretro
          PROFILE_NAME: Retro-Saturn AppStore
          IDENTITY: Apple Distribution
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign \
            --build-number=${{ steps.buildno.outputs.n }}

          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/archive/Runner.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="$IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>$IDENTITY</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ios/ipa

          ls -l build/ios/ipa

      - name: Upload to App Store Connect
        if: steps.creds.outputs.have == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          # altool finds the key by this exact filename, derived from the key
          # id -- it is not configurable.
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 -d \
            > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          ipa=$(ls flutter_app/build/ios/ipa/*.ipa | head -1)
          echo "uploading $ipa"
          # No --validate-app first: structural checks run server-side AFTER
          # the transfer, so a clean validation proves nothing and only costs
          # a second upload of the same bytes.
          xcrun altool --upload-app -f "$ipa" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          rm -f ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - uses: actions/upload-artifact@v4
        if: steps.creds.outputs.have == 'true'
        with:
          name: ios-ipa
          path: flutter_app/build/ios/ipa/*.ipa

  release:
    needs: [android, linux, ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            android-apk/*.apk
            android-aab/*.aab
            ios-app/*.app.zip
            linux-bundle/*.tar.gz