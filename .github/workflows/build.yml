name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # One place, like Retro-C64. Repeating the literal in every job is how
  # they drift apart.
  FLUTTER_VERSION: '3.41.9'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # ymir-core has 8 sub-submodules (mio, fmt, imgui, xxHash, lz4,
          # libchdr, concurrentqueue, vcpkg) which Flutter's CMake pulls
          # in via add_subdirectory(libs/ymir-core).
      # Pinned, like the Amiga, C64 and DOSBox workflows. Unpinned, this
      # follows whatever stable is on the day, and a new analyzer lint turns
      # a green pipeline red with no change to the code -- which is exactly
      # what happened: CI on 3.47.1 found an issue 3.41.9 does not have, and
      # the analyze job failing skipped android, linux, ios and release.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
        working-directory: flutter_app
      - run: flutter analyze
        working-directory: flutter_app
      - run: flutter test
        working-directory: flutter_app

  android:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - uses: android-actions/setup-android@v3
      - name: Build Android arm64-v8a .so
        run: native/ymir_core/android/build.sh
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-android.outputs.ndk-path }}
      - run: |
          test -f flutter_app/android/app/src/main/jniLibs/arm64-v8a/libymircore.so
      # Signed with the release key, not the debug one.
      #
      # This job used to build the bundle with no keystore at all, which
      # produces an artefact that installs on a dev device and is refused by
      # Play -- the release key is what identifies this as an update to
      # com.crownpark.ymir_multiplatform rather than a different app. The
      # secrets have been on this repo since June; nothing was reading them.
      #
      # build.gradle.kts picks the keystore up from these ANDROID_* env vars
      # and falls back to the debug key when they are absent, so a fork
      # without the secrets still gets a green build rather than a failure it
      # cannot fix.
      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/release.jks"

      - run: flutter build apk --release
        working-directory: flutter_app
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/signing/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: flutter build appbundle --release
        working-directory: flutter_app
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/signing/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      # The bundle has to be signed as the app it replaces: a different key is
      # a different app as far as the Console is concerned, and this is the
      # cheap place to catch that rather than at upload.
      - name: Print signing fingerprint
        run: |
          keytool -printcert -jarfile \
            flutter_app/build/app/outputs/bundle/release/app-release.aab \
            | grep -E "SHA256:|Owner:" || true
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: flutter_app/build/app/outputs/bundle/release/app-release.aab

  linux:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      # flutter build linux needs the GTK stack, not just ALSA: the desktop
      # embedder's CMakeLists does pkg_check_modules(gtk+-3.0) and fails the
      # configure step without it. Only libasound2-dev was installed, which
      # covers the core's audio backend and nothing the shell needs.
      - run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libgtk-3-dev liblzma-dev pkg-config \
            ninja-build clang cmake
      - name: Build Linux host tests + .so
        run: native/ymir_core/linux/build-ymir-linux.sh
      - name: Run native tests
        run: |
          for t in ymir_smoke_test ymir_peripheral_test \
                   ymir_swap_snapshot_test ymir_audio_tone_test; do
            native/ymir_core/linux/build/$t
          done
      - run: flutter build linux --release
        working-directory: flutter_app
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: flutter_app/build/linux/x64/release/bundle

  ios:
    needs: analyze
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      # Built natively, on the Mac, with Xcode's own toolchain.
      #
      # This used to shell out to tools/build-ios-linux.sh, which drove the
      # mobaiapp/iosbox Docker image -- a path that could never run here.
      # macOS runners have no Docker (the failure was a bare `docker: command
      # not found`), and moving it to a Linux runner would not have helped
      # either: that image also wants an iOS SDK volume populated by hand from
      # an Xcode extraction. A Mac already has the SDK, so nothing needs to be
      # cross-anything. The script installs the framework into
      # flutter_app/ios/Frameworks, which is where the Runner embeds it from.
      - name: Build YmirCore.framework for iOS arm64
        run: native/ymir_core/ios/build-ios-macos.sh

      - name: Verify the framework was produced
        run: |
          fw=flutter_app/ios/Frameworks/YmirCore.framework
          if [ ! -f "$fw/YmirCore" ]; then
            echo "::error::$fw/YmirCore is missing -- the core build did not install it."
            exit 1
          fi
          file "$fw/YmirCore"
          case "$(file -b "$fw/YmirCore")" in
            *arm64*) ;;
            *) echo "::error::YmirCore is not arm64 -- a simulator slice was built"; exit 1 ;;
          esac

      - run: flutter build ios --release --no-codesign
        working-directory: flutter_app

      # An app that builds but ships no core installs fine and then dies at
      # the first dlopen, which reads as a signing fault and is not one. Prove
      # the embed phase actually ran, at the exact path
      # YmirNativePaths.iosFrameworkLibrary() opens at runtime.
      - name: Verify the core is embedded in the app
        run: |
          app=flutter_app/build/ios/iphoneos/Runner.app
          binary="$app/Frameworks/YmirCore.framework/YmirCore"
          if [ ! -f "$binary" ]; then
            echo "::error::YmirCore.framework is missing from $app/Frameworks --"
            echo "::error::the Runner target's Embed Frameworks phase did not copy it."
            exit 1
          fi
          file "$binary"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: flutter_app/build/ios/iphoneos/Runner.app

  release:
    needs: [android, linux, ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            android-apk/*.apk
            android-aab/*.aab
            ios-app/*.app.zip
            linux-bundle/*.tar.gz