name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # One place, like Retro-C64. Repeating the literal in every job is how
  # they drift apart.
  FLUTTER_VERSION: '3.41.9'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

        with:
          submodules: recursive
          # ymir-core has 8 sub-submodules (mio, fmt, imgui, xxHash, lz4,
          # libchdr, concurrentqueue, vcpkg) which the core's CMake pulls
          # in via add_subdirectory(core/libs/ymir-core).
      # Pinned, like the Amiga, C64 and DOSBox workflows. Unpinned, this
      # follows whatever stable is on the day, and a new analyzer lint turns
      # a green pipeline red with no change to the code -- which is exactly
      # what happened: CI on 3.47.1 found an issue 3.41.9 does not have, and
      # the analyze job failing skipped android and linux.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
        working-directory: flutter_app
      - run: flutter analyze
        working-directory: flutter_app
      - run: flutter test
        working-directory: flutter_app

  android:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      # packages: '' or the action tries to install the obsolete "tools"
      # package, which was withdrawn from the SDK repository -- sdkmanager
      # exits 1 with "Failed to find package 'tools'" and the job dies before
      # it has built anything. Each job below installs what it actually needs.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Build Android arm64-v8a .so
        run: core/retro/android/build.sh
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-android.outputs.ndk-path }}
          # The core repository has no idea where this app keeps its jniLibs,
          # so it defaults to its own retro/android/prebuilt and lets the
          # consumer say. Without this the next step's `test -f` fails on a
          # core that built perfectly well.
          JNI_LIBS_DIR: ${{ github.workspace }}/flutter_app/android/app/src/main/jniLibs/arm64-v8a
      - run: |
          test -f flutter_app/android/app/src/main/jniLibs/arm64-v8a/libymircore.so
      # Signed with the release key, not the debug one.
      #
      # This job used to build the bundle with no keystore at all, which
      # produces an artefact that installs on a dev device and is refused by
      # Play -- the release key is what identifies this as an update to
      # com.crownpark.ymir_multiplatform rather than a different app. The
      # secrets have been on this repo since June; nothing was reading them.
      #
      # build.gradle.kts picks the keystore up from these ANDROID_* env vars
      # and falls back to the debug key when they are absent, so a fork
      # without the secrets still gets a green build rather than a failure it
      # cannot fix.
      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/release.jks"

      - run: flutter build appbundle --release
        working-directory: flutter_app
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/signing/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      # The bundle has to be signed as the app it replaces: a different key is
      # a different app as far as the Console is concerned, and this is the
      # cheap place to catch that rather than at upload.
      - name: Print signing fingerprint
        run: |
          keytool -printcert -jarfile \
            flutter_app/build/app/outputs/bundle/release/app-release.aab \
            | grep -E "SHA256:|Owner:" || true
      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: flutter_app/build/app/outputs/bundle/release/app-release.aab

  # ------------------------------------------------------------------
  # The native app: SDL3 + Dear ImGui over libymircore, which is what
  # Retro-Saturn now is. The Flutter job above builds the interface this
  # replaces and stays until that one is retired.
  #
  # It is here rather than on a developer machine for one reason: the upload
  # key exists only as a secret on this repository. GitHub secrets cannot be
  # read back -- not by CI logs, not by the owner -- so a signed bundle can
  # only be produced where the secret is, and that is here.
  # ------------------------------------------------------------------
  android-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up the Android SDK
        id: setup-android
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install the NDK the build pins
        run: sdkmanager --install "ndk;28.2.13676358" "platforms;android-36" "build-tools;35.0.0"
      - name: Ninja, which the SDL3 and core builds use
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # SDL3, the core and the frontend, into app/src/main/jniLibs.
      - name: Build the native libraries
        run: ./android/build-core.sh
        env:
          ANDROID_NDK: ${{ steps.setup-android.outputs.ndk-path || format('{0}/ndk/28.2.13676358', env.ANDROID_SDK_ROOT) }}

      - name: Check the libraries are actually there
        run: |
          ls -lh android/app/src/main/jniLibs/arm64-v8a/
          test -f android/app/src/main/jniLibs/arm64-v8a/libretrosaturn.so
          test -f android/app/src/main/jniLibs/arm64-v8a/libymircore.so
          test -f android/app/libs/SDL3.jar

      # Signed as the app it replaces. A different key is a different app as
      # far as the Console is concerned, and a bundle signed with the debug
      # key installs on a dev device and is refused by Play.
      - name: Decode the signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/release.jks"
          test -s "$RUNNER_TEMP/signing/release.jks"

      - name: Build the release bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/signing/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:bundleRelease

      # The cheap place to catch a wrong key, rather than at upload.
      - name: Print the signing fingerprint
        run: |
          keytool -printcert -jarfile \
            android/app/build/outputs/bundle/release/app-release.aab \
            | grep -E "SHA256:|Owner:" || true

      - uses: actions/upload-artifact@v4
        with:
          name: retro-saturn-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

  linux:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      # flutter build linux needs the GTK stack, not just ALSA: the desktop
      # embedder's CMakeLists does pkg_check_modules(gtk+-3.0) and fails the
      # configure step without it. Only libasound2-dev was installed, which
      # covers the core's audio backend and nothing the shell needs.
      - run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libgtk-3-dev liblzma-dev pkg-config \
            ninja-build clang cmake
      - name: Build Linux host tests + .so
        run: core/retro/linux/build-ymir-linux.sh
      - name: Run native tests
        run: |
          # Every test the build produced, not a hand-maintained list of four.
          # Five more were added over time and CI never ran any of them.
          for t in core/retro/linux/build/ymir_*_test; do
            echo "== $t"; "$t"
          done
      - run: flutter build linux --release
        working-directory: flutter_app
