name: ymir_multiplatform
description: "Sega Saturn multiplatform emulator. Linux + Android + iOS."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.11.5

# Same proven dep set as ViceMultiplatform + DosboxMultiplatform.
# Deliberately small, no state-management framework (see lib/main.dart).
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  ffi: ^2.1.3
  path: ^1.9.0
  file_picker: ^8.1.7
  shared_preferences: ^2.3.5
  path_provider: ^2.1.5
  gamepads: ^0.1.10+5
  http: ^1.6.0
  archive: ^4.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/bezels/
    - assets/bios/